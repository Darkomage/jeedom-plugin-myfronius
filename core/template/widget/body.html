<div class="mfr-widget" id="mfr-#uid#">
  <!-- 1. ligne principale -->
  <div class="mfr-row mfr-main">
    <div class="mfr-tile mfr-pv"><span class="v" data-k="p_pv">—</span><span class="s">W · PV</span></div>
    <div class="mfr-flow" data-f="pv" style="--mfr-c:var(--mfr-pv)"></div>
    <div class="mfr-tile mfr-house"><span class="v" data-k="p_load">—</span><span class="s">W · maison</span></div>
    <div class="mfr-flow" data-f="grid" style="--mfr-c:var(--mfr-grid)"></div>
    <div class="mfr-tile mfr-grid"><span class="v" data-k="p_grid">—</span><span class="s" data-k="grid_label">W · réseau</span></div>
  </div>
  <!-- 2. charges pilotées -->
  <div class="mfr-bus #mfr_consumers_class#"></div>
  <div class="mfr-items mfr-consumers #mfr_consumers_class#">#mfr_consumers#</div>
  <!-- 3. pilotables -->
  <div class="mfr-bus #mfr_control_bus_class#"></div>
  <div class="mfr-items mfr-control #mfr_control_class#">#mfr_control#</div>
  <!-- 4. indicateurs -->
  <div class="mfr-kpi #mfr_kpi_class#">
    <span>Surplus<b data-k="surplus">—</b> W</span>
    <span>Autonomie<b data-k="rel_autonomy">—</b> %</span>
    <span>Surplus batt. incl.<b data-k="surplus_batt">—</b> W</span>
    <span>Autoconso<b data-k="rel_selfconsumption">—</b> %</span>
  </div>
  <div class="mfr-day #mfr_day_class#">Jour : prod <b data-k="e_day_pv">—</b> · conso <b data-k="e_day_load">—</b> · export <b data-k="e_day_export">—</b> kWh</div>
  <!-- 5. chips -->
  <div class="mfr-chips #mfr_chips_class#">
    <span class="mfr-chip" data-k="chip_mode">—</span>
    <span class="mfr-chip" data-k="chip_backup">—</span>
    <span class="mfr-chip" data-k="chip_comm">—</span>
  </div>
</div>
<script>
(function () {
  // Corps partagé du widget Site (dashboard et mobile). L'hôte, défini par le template, fournit
  // window.mfrHost = { subscribe(id, fn), execute(id) } ; fn reçoit { value, display_value }.
  var root = document.getElementById('mfr-#uid#');
  var host = window.mfrHost;
  if (!root || !host) { return; }
  var data = #mfr_data#;
  var values = {};
  // Fraîcheur : comm_ok n'est envoyé qu'aux changements d'état et reste à 1 si le démon s'arrête
  // ou si ses envois échouent. « Dernière mise à jour » change à chaque cycle réussi : sans elle
  // depuis data.stale_after secondes (data.age = âge du dernier lot au rendu), données figées.
  var lastSeen = (data.age === null || data.age === undefined) ? null : Date.now() - data.age * 1000;
  function stale() {
    if (!data.stale_after || !data.cmds || !data.cmds.last_update || !data.cmds.last_update.id) { return false; }
    return lastSeen === null || Date.now() - lastSeen > data.stale_after * 1000;
  }
  var SITE_MODES = { 'bidirectional': 'bidirectionnel', 'produce-only': 'sans compteur', 'meter': 'compteur', 'vague-meter': 'compteur', 'ac-coupled': 'batterie AC' };
  // Modes batterie Fronius (Battery_Mode) → libellés courts
  var BAT_MODES = { 'disabled': 'désactivée', 'normal': 'normal', 'service': 'maintenance', 'charge boost': 'charge boost',
    'nearly depleted': 'presque vide', 'suspended': 'suspendue', 'calibrate': 'calibrage', 'grid support': 'soutien réseau',
    'deplete recovery': 'récupération', 'non operable (voltage)': 'hors service (tension)', 'non operable (temperature)': 'hors service (temp.)',
    'preheating': 'préchauffage', 'startup': 'démarrage', 'stopped (temperature)': 'arrêtée (temp.)', 'battery full': 'pleine' };
  // Pilotage Modbus : modes accessibles par − / + (les modes avec valeur reviennent à auto)
  var CTRL_ORDER = ['auto', 'hold', 'no_charge'];
  var CTRL_LABELS = { 'auto': 'auto', 'hold': 'déch. bloquée', 'no_charge': 'charge bloquée', 'force_charge': 'charge forcée', 'limit_charge': 'charge limitée' };
  var LOAD_MODES = { 'auto': 'auto', 'on': 'forcé on', 'off': 'forcé off' };

  function el(k) { return root.querySelector('[data-k="' + k + '"]'); }
  function txt(k, v) { var e = el(k); if (e) { e.textContent = v; } }
  function num(v) {
    if (v === null || v === undefined || v === '') { return null; }
    if (typeof v === 'number') { return isNaN(v) ? null : v; }
    // Jeedom peut livrer une valeur formatée (séparateur de milliers « 1 819 » ou « 1.819 »,
    // virgule décimale) : on la ramène à un nombre brut avant de parser.
    var s = String(v).replace(/[\s  ']/g, '');
    if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) { s = s.replace(/\./g, ''); }
    s = s.replace(',', '.');
    var n = parseFloat(s);
    return isNaN(n) ? null : n;
  }
  function fmtW(v, signed) {
    if (v === null || v === undefined) { return '—'; }
    var r = Math.round(v), s = Math.abs(r).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    if (r < 0) { return '−' + s; }
    return (signed && r > 0 ? '+' : '') + s;
  }
  function fmtKwh(v) { return v === null ? '—' : v.toFixed(1).replace('.', ','); }
  function fmtPct(v) { return v === null ? '—' : Math.round(v).toString(); }
  function flow(key, power, reverse) {
    var f = root.querySelector('[data-f="' + key + '"]');
    if (!f) { return; }
    var p = Math.abs(power || 0);
    f.classList.toggle('on', p >= 10);
    f.classList.toggle('rev', !!reverse);
    f.classList.toggle('slow', p < 500);
    f.classList.toggle('fast', p >= 2000);
  }
  function get(k) { return values[k] === undefined ? null : values[k]; }
  // Zone morte d'affichage : autour de zéro, la mesure réseau et batterie du GEN24 n'est que du
  // bruit (quelques watts). En dessous de ce seuil le widget affiche 0 ; les commandes gardent
  // la valeur exacte pour les scénarios.
  var DEADZONE_W = 50;
  function dz(v) { return (v === null || Math.abs(v) < DEADZONE_W) ? (v === null ? null : 0) : v; }

  function render() {
    var pv = num(get('p_pv')), grid = dz(num(get('p_grid'))), akku = dz(num(get('p_akku')));
    // Secours (îlotage) : Smart Meter hors ligne, la mesure réseau n'a plus de sens → invalidée
    var islanded = num(get('backup_mode')) === 1;
    if (islanded) { grid = null; }
    // Maison affichée hors bornes de recharge (elles ont leurs propres tuiles) ; repli sur le total
    var load = num(get('p_load_ex_ev'));
    if (load === null) { load = num(get('p_load')); }
    txt('p_pv', fmtW(pv)); txt('p_load', fmtW(load));
    txt('p_grid', grid === null ? '—' : fmtW(grid, false));           // + import, − export (convention humaine du plugin)
    txt('grid_label', islanded ? 'réseau coupé' : grid === null ? 'W · réseau' : (grid > 0 ? 'W · import' : (grid < 0 ? 'W · export' : 'W · réseau')));
    flow('pv', pv, false);
    flow('grid', grid, grid !== null && grid > 0);                        // export : maison → réseau ; import : inverse
    // charges pilotées
    var sum = 0;
    (data.loads || []).forEach(function (l, i) {
      var k = 'ld' + i, v = num(get(k + '_p')), st = num(get(k + '_state')), md = get(k + '_mode');
      if (v !== null) { sum += Math.max(v, 0); }
      txt(k + '_p', v === null ? '—' : fmtW(v) + ' W');
      txt(k + '_mode', md === null ? '—' : (LOAD_MODES[String(md)] || String(md)));
      var dot = el(k + '_dot'); if (dot) { dot.classList.toggle('on', st === 1); }
      var tile = root.querySelector('[data-ld="' + i + '"]'); if (tile) { tile.classList.toggle('active', st === 1); }
      flow(k, st === 1 ? (v || 0) : 0, false);
    });
    if (data.loads && data.loads.length) {
      txt('rest', load === null ? '—' : fmtW(Math.max(load - sum, 0)) + ' W');
    }
    // batterie
    if (data.battery) {
      var soc = num(get('soc'));
      txt('soc', soc === null ? '—' : Math.round(soc) + ' %');
      var bar = el('socbar'); if (bar) { bar.style.width = (soc === null ? 0 : Math.max(0, Math.min(100, soc))) + '%'; }
      txt('p_bat', fmtW(akku, true));
      var bm = get('bat_mode');
      txt('bat_mode', bm === null ? '—' : (BAT_MODES[String(bm).toLowerCase()] || String(bm)));
      flow('bat', akku, akku !== null && akku < 0);                     // charge : vers la batterie ; décharge : inverse
      if (data.battery_ctrl) {
        var cm = get('ctrl_mode');
        txt('ctrl_label', cm === null ? '—' : (CTRL_LABELS[String(cm)] || String(cm)));
        var btile = root.querySelector('.mfr-battery');
        if (btile) { btile.classList.toggle('active', cm !== null && String(cm) !== 'auto' && num(get('ctrl_active')) === 1); }
      }
    }
    // bornes
    (data.chargers || []).forEach(function (ch, i) {
      // Liaison perdue : puissance et état voiture inconnus (« — », « hors ligne ») plutôt que 0 W
      var offline = num(get('ch' + i + '_connected')) === 0;
      var p = offline ? null : num(get('ch' + i + '_p')), car = get('ch' + i + '_car');
      var tile = root.querySelector('[data-ch="' + i + '"]');
      txt('ch' + i + '_p', fmtW(p));
      var pv2 = el('ch' + i + '_p'); if (pv2) { pv2.classList.toggle('idle', !(p >= 10)); }
      txt('ch' + i + '_car', offline ? '⚠ hors ligne' : car === null ? '' : ({ '0': '? inconnu', '2': '● charge', '3': '● attente', '4': '● terminé', '5': '⚠ erreur', '1': '○ absente' }[String(car)] || String(car)));
      txt('ch' + i + '_mode', get('ch' + i + '_mode') === null ? '—' : String(get('ch' + i + '_mode')));
      if (tile) { tile.classList.toggle('active', p >= 10); }
      flow('ch' + i, p, false);
    });
    // indicateurs
    txt('surplus', fmtW(dz(num(get('surplus'))))); txt('surplus_batt', fmtW(dz(num(get('surplus_batt')))));
    txt('rel_autonomy', fmtPct(num(get('rel_autonomy')))); txt('rel_selfconsumption', fmtPct(num(get('rel_selfconsumption'))));
    txt('e_day_pv', fmtKwh(num(get('e_day_pv')))); txt('e_day_load', fmtKwh(num(get('e_day_load')))); txt('e_day_export', fmtKwh(num(get('e_day_export'))));
    // chips
    var mode = get('mode'), cm = el('chip_mode');
    if (cm) {
      if (mode === null || mode === '') { cm.classList.add('mfr-hidden'); }
      else { cm.classList.remove('mfr-hidden'); cm.textContent = SITE_MODES[mode] || mode; }
    }
    var backup = get('backup_mode'), cb = el('chip_backup');
    if (cb) {
      if (backup === null) { cb.classList.add('mfr-hidden'); }
      else { cb.classList.remove('mfr-hidden'); cb.textContent = (num(backup) === 1) ? 'SECOURS ACTIF' : 'secours : prêt'; cb.classList.toggle('alert', num(backup) === 1); }
    }
    var comm = get('comm_ok'), cc = el('chip_comm');
    if (cc) {
      var off = comm !== null && num(comm) !== 1, frozen = !off && stale();
      cc.textContent = off ? 'HORS LIGNE' : (frozen ? 'données figées' : (comm === null ? '—' : 'comm. OK'));
      cc.classList.toggle('alert', off || frozen);
    }
  }

  // valeurs initiales + abonnement aux mises à jour live
  Object.keys(data.cmds || {}).forEach(function (k) {
    var c = data.cmds[k];
    values[k] = c.value;
    if (c.id) {
      // Le core (addUpdateFunction) ignore une fonction dont le texte (toString) est déjà abonné à
      // la commande : l'uid du rendu, en commentaire, distingue chaque rendu. Sans lui, une tuile
      // re-rendue sur place (refreshWidget) ou affichée deux fois ne recevrait plus rien. Les
      // instances retirées du DOM restent abonnées jusqu'au changement de page, sans effet.
      host.subscribe(String(c.id), function (_options) {
        /* mfr-#uid# */
        if (!root.isConnected) { return; }
        // Valeur brute de préférence : display_value est formatée selon les préférences
        // d'affichage de Jeedom (séparateur de milliers) et ne doit pas être parsée.
        values[k] = (_options.value !== undefined && _options.value !== null) ? _options.value : _options.display_value;
        if (k === 'last_update') { lastSeen = Date.now(); }
        render();
      });
    }
  });
  root.querySelectorAll('.mfr-btn[data-cmd]').forEach(function (b) {
    b.addEventListener('click', function (ev) { ev.stopPropagation(); host.execute(b.getAttribute('data-cmd')); });
  });
  root.querySelectorAll('.mfr-btn[data-bctl]').forEach(function (b) {
    b.addEventListener('click', function (ev) {
      ev.stopPropagation();
      if (!data.battery_ctrl) { return; }
      var current = String(get('ctrl_mode') || 'auto');
      var idx = CTRL_ORDER.indexOf(current);
      var next;
      if (idx < 0) { next = 'auto'; }                                   // charge forcée / limitée → retour auto
      else { next = CTRL_ORDER[(idx + (b.getAttribute('data-bctl') === 'next' ? 1 : CTRL_ORDER.length - 1)) % CTRL_ORDER.length]; }
      host.execute(data.battery_ctrl[next]);
    });
  });
  render();
  // Réévaluation périodique de la fraîcheur (aucun événement n'arrive quand le démon est arrêté)
  var staleTimer = setInterval(function () {
    if (!root.isConnected) { clearInterval(staleTimer); return; }
    render();
  }, 30000);
})();
</script>
